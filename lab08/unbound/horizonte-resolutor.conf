# /etc/unbound/unbound.conf.d/horizonte-resolutor.conf — Resolutor del colegio (10.10.10.4)
# Rol: resolver TODO para la red del colegio, con caché, validación DNSSEC, salida cifrada (DoT) y filtrado (RPZ).
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no

    # Solo la red del colegio puede usarlo (un resolutor abierto es un arma de amplificación)
    # TODO: ¡resolutor abierto al mundo! Rechaza todo y permite solo 127.0.0.0/8 y 10.10.10.0/24
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.10.10.0/24 allow

    # Privacidad y robustez
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes          # a cada servidor solo se le pregunta lo mínimo necesario
    prefetch: yes                    # renueva en caché lo popular antes de que venza
    serve-expired: yes               # si internet se cae, responde lo último conocido (máx. 1 día)
    serve-expired-ttl: 86400
    cache-min-ttl: 60
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # DNSSEC: validar todo lo firmado. El ancla de confianza de la raíz ya la declara Ubuntu en
    # root-auto-trust-anchor-file.conf (/var/lib/unbound/root.key, creada con unbound-anchor).
    # respip = módulo que aplica la RPZ; validator = DNSSEC; iterator = resolución
    module-config: "respip validator iterator"
    # .internal NO existe en la raíz: sin esto, la validación diría que nuestras respuestas son falsas (bogus)
    # TODO: marcar horizonte.internal y 10.10.10.in-addr.arpa como domain-insecure (prueba primero SIN esto: ¿qué pasa?)
    domain-insecure: "horizonte.internal"
    domain-insecure: "10.10.10.in-addr.arpa"
    # Permitir respuestas con IPs privadas solo para nuestros dominios (protección contra DNS rebinding)
    private-address: 10.0.0.0/8
    private-domain: "horizonte.internal"
    # Unbound bloquea por defecto las inversas de redes privadas (10.in-addr.arpa → "static", sin respuesta).
    # nodefault quita ese bloqueo para que nuestra stub-zone 10.10.10.in-addr.arpa funcione.
    # TODO: quitar el bloqueo por defecto de las inversas privadas (local-zone: "10.in-addr.arpa." …)
    local-zone: "10.in-addr.arpa." nodefault

    # Certificados de las CA públicas para verificar el DoT
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    log-queries: no
    verbosity: 1

# Nuestras zonas: preguntar directamente a ns1 y ns2 (autoritativos del colegio)
stub-zone:
    name: "horizonte.internal"
    stub-addr: 10.10.10.2
    stub-addr: 10.10.10.3

stub-zone:
    name: "10.10.10.in-addr.arpa"
    stub-addr: 10.10.10.2
    stub-addr: 10.10.10.3

# Todo lo demás: reenviar CIFRADO (DNS sobre TLS, puerto 853) a resolutores públicos
forward-zone:
    name: "."
    # TODO: sale en claro por el puerto 53. Cífralo: forward-tls-upstream y
    #       direcciones IP@853#nombre-del-certificado (Cloudflare y Quad9)
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net

# Filtrado con RPZ (Response Policy Zone): la lista negra del colegio en formato estándar
rpz:
    name: "rpz.horizonte.internal"
    zonefile: "/etc/unbound/rpz.horizonte.internal"
    rpz-log: yes
    rpz-log-name: "filtro-colegio"

# (remote-control ya está habilitado por Ubuntu en remote-control.conf: unbound-control funciona sin más)
